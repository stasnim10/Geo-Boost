openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: geoboost
    description: GEOboost AI visibility audit and optimization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /geoboost/audit:
    post:
      operationId: runAudit
      tags: [geoboost]
      summary: Audit a business website for AI visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRequest"
      responses:
        "200":
          description: Audit results with scores and weaknesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /geoboost/detect-category:
    post:
      operationId: detectCategory
      tags: [geoboost]
      summary: Detect business category from website URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectCategoryRequest"
      responses:
        "200":
          description: Detected category result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectCategoryResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /geoboost/optimize:
    post:
      operationId: optimizeContent
      tags: [geoboost]
      summary: Optimize content for AI visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
      responses:
        "200":
          description: Optimized content with highlighted changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /citation/simulate:
    post:
      operationId: simulateCitation
      tags: [geoboost]
      summary: Simulate AI search and return citation results from all 4 models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateCitationRequest"
      responses:
        "200":
          description: Citation results from ChatGPT, Claude, Gemini, and Perplexity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateCitationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuditRequest:
      type: object
      properties:
        url:
          type: string
          description: The business website URL to audit
        category:
          type: string
          description: Business category (e.g. "premium laptop bags")
        queries:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 3
          description: Three target queries to rank for in AI answers
        location:
          type: string
          description: Business city or region (e.g. "Rochester, NY")
        name:
          type: string
          description: Submitter name for email capture
        email:
          type: string
          format: email
          description: Submitter email for email capture
      required:
        - url
        - category
        - queries
        - name
        - email
    AuditCitationModelResult:
      type: object
      properties:
        model:
          type: string
          enum: [chatgpt, claude, gemini, perplexity]
        modelLabel:
          type: string
        mentioned:
          type: boolean
        position:
          type: integer
          nullable: true
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/CitationBusiness"
        sources:
          type: array
          items:
            type: string
        excerpt:
          type: string
        error:
          type: string
      required:
        - model
        - modelLabel
        - mentioned
        - position
        - businesses
        - sources
        - excerpt
    AuditCitationQueryResult:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/AuditCitationModelResult"
        durationMs:
          type: integer
      required:
        - query
        - results
        - durationMs
    AuditResult:
      type: object
      properties:
        aiVisibilityScore:
          type: integer
          minimum: 0
          maximum: 100
        semanticDensityScore:
          type: integer
          minimum: 0
          maximum: 100
        structuralFormattingScore:
          type: integer
          minimum: 0
          maximum: 100
        aiCitationScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Real citation score from live AI model tests (null if not available on free plan)
        weaknesses:
          type: array
          items:
            type: string
          description: Three specific weaknesses found in the content
        competitorPatterns:
          type: array
          items:
            type: string
          description: Three competitor content patterns AI prefers
        scrapedUrl:
          type: string
          description: The URL that was analyzed
        bingIndexed:
          type: boolean
          description: Whether the domain is indexed in Bing (ChatGPT uses Bing to find sources)
        blockedBots:
          type: array
          items:
            type: string
          description: List of AI crawlers blocked in robots.txt (e.g. GPTBot, ClaudeBot)
        citationResults:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AuditCitationQueryResult"
          description: Live citation test results per query (null if not available on free plan)
      required:
        - aiVisibilityScore
        - semanticDensityScore
        - structuralFormattingScore
        - weaknesses
        - competitorPatterns
        - scrapedUrl
    OptimizeRequest:
      type: object
      properties:
        content:
          type: string
          description: The current page content to optimize
        queries:
          type: array
          items:
            type: string
          description: Target queries to optimize for
        category:
          type: string
          description: Business category for context
      required:
        - content
        - queries
    ContentChange:
      type: object
      properties:
        type:
          type: string
          description: Type of change (e.g. "definition-first", "specificity", "structure", "bold-entity", "faq")
        reason:
          type: string
          description: Why this change improves AI visibility
        original:
          type: string
          description: The original text snippet
        optimized:
          type: string
          description: The optimized text snippet
      required:
        - type
        - reason
    OptimizeResult:
      type: object
      properties:
        originalContent:
          type: string
        optimizedContent:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ContentChange"
          description: List of specific changes made with explanations
      required:
        - originalContent
        - optimizedContent
        - changes
    DetectCategoryRequest:
      type: object
      properties:
        url:
          type: string
          description: The business website URL to detect category from
      required:
        - url
    DetectCategoryResult:
      type: object
      properties:
        category:
          type: string
          nullable: true
          description: Detected business category, or null if not detected
        confidence:
          type: string
          enum: [high, low]
          description: Confidence level of the detection
      required:
        - category
        - confidence
    SimulateCitationRequest:
      type: object
      properties:
        query:
          type: string
          description: The search query to test across all AI models
        domain:
          type: string
          description: Optional business domain to check for mentions (e.g. mybusiness.com)
      required:
        - query
    CitationBusiness:
      type: object
      properties:
        name:
          type: string
        rank:
          type: integer
        url:
          type: string
          nullable: true
      required:
        - name
        - rank
        - url
    ModelCitationResult:
      type: object
      properties:
        model:
          type: string
          enum: [chatgpt, claude, gemini, perplexity]
        modelLabel:
          type: string
        mentioned:
          type: boolean
        position:
          type: integer
          nullable: true
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/CitationBusiness"
        sources:
          type: array
          items:
            type: string
        excerpt:
          type: string
        rawResponse:
          type: string
        error:
          type: string
      required:
        - model
        - modelLabel
        - mentioned
        - position
        - businesses
        - sources
        - excerpt
        - rawResponse
    SimulateCitationResult:
      type: object
      properties:
        query:
          type: string
        domain:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/ModelCitationResult"
        durationMs:
          type: integer
      required:
        - query
        - results
        - durationMs
    ApiError:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error
